name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Resolve base path
        id: base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${REPO}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      - name: Prepare publish directory
        run: |
          mkdir -p _site
          if [ -d dist ] && [ "$(ls -A dist 2>/dev/null)" ]; then
            cp -R dist/. _site/
          fi
          if [ -d .output/public ] && [ "$(ls -A .output/public 2>/dev/null)" ]; then
            cp -R .output/public/. _site/
          fi
          # GitHub Pages SPA fallback for client-side routes
          if [ -f _site/index.html ]; then
            cp _site/index.html _site/404.html
          elif [ -f _site/_shell.html ]; then
            cp _site/_shell.html _site/index.html
            cp _site/_shell.html _site/404.html
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
